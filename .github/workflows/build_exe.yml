name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "SmartUnpacker" --add-binary "UnRAR.exe;." --icon="icon.ico" archive_unpacker.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartUnpacker-Windows
        path: dist/SmartUnpacker.exe
        retention-days: 7 # Артефакт будет храниться 7 дней