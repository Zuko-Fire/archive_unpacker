name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "SmartUnpacker" --add-binary "UnRAR.exe;." archive_unpacker.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v3
      with:
        name: SmartUnpacker-Windows
        path: dist/SmartUnpacker.exe